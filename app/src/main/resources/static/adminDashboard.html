<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Smart Clinic - Tableau de bord Administrateur</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .container { width: 480px; text-align: left; }
        h2 { text-align: center; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #d5dbdb; padding: 6px 8px; text-align: left; }
        th { background: #ecf0f1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" style="text-align:center;">🏥 Smart Clinic</div>
        <div class="subtitle" style="text-align:center;">Tableau de bord Administrateur</div>

        <h2>Ajouter un médecin</h2>
        <form id="addDoctorForm">
            <label for="name">Nom</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" required>

            <label for="specialty">Spécialité</label>
            <input type="text" id="specialty" required>

            <label for="phone">Téléphone</label>
            <input type="text" id="phone">

            <button type="submit">Ajouter le médecin</button>
            <div class="error-msg" id="statusMsg"></div>
        </form>

        <h2>Liste des médecins</h2>
        <table id="doctorsTable">
            <thead>
                <tr><th>Nom</th><th>Email</th><th>Spécialité</th></tr>
            </thead>
            <tbody id="doctorsBody"></tbody>
        </table>

        <a href="/roleSelection.html" class="back-link">&larr; Déconnexion</a>
    </div>

    <script src="/js/adminDashboard.js"></script>
</body>
</html>
