<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Smart Clinic - Tableau de bord Médecin</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .container { width: 520px; text-align: left; }
        h2 { text-align: center; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #d5dbdb; padding: 6px 8px; text-align: left; }
        th { background: #ecf0f1; }
        label { margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" style="text-align:center;">🏥 Smart Clinic</div>
        <div class="subtitle" style="text-align:center;">Tableau de bord Médecin</div>

        <h2>Mes rendez-vous</h2>
        <label for="dateInput">Filtrer par date</label>
        <input type="date" id="dateInput" onchange="loadAppointments()">

        <table id="patientTable">
            <thead>
                <tr><th>Patient</th><th>Date / Heure</th><th>Statut</th></tr>
            </thead>
            <tbody id="patientTableBody"></tbody>
        </table>

        <a href="/roleSelection.html" class="back-link">&larr; Déconnexion</a>
    </div>

    <script src="/js/doctorDashboard.js"></script>
</body>
</html>
